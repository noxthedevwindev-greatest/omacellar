# omacellar :: runner registry
#
# One record per line, pipe separated. Fields:
#
#   1 id           short name used on the command line        (soda, wine-ge)
#   2 family       grouping used in listings                  (bottles, glorious, kron4ek)
#   3 title        human readable name                        (Soda)
#   4 repo         GitHub repo, owner/name                   (bottlesdevs/wine)
#   5 kind         wine | proton                              how it must be launched
#   6 ver_re       ERE with ONE capture group, applied to a release tag.
#                  the capture is the runner version          (^soda-([0-9.]+)$)
#   7 asset_re     ERE matched against asset names. Placeholders
#                  {ver} and {arch} are substituted first.    (^soda-{ver}-{arch}\.tar\.xz$)
#   8 arches      comma list of arches the upstream provides (x86_64,aarch64)
#   9 channel      stable | experimental | variant            listing filter
#  10 homepage     where this runner comes from
#  11 description  one line, shown by `runner info`
#
# Everything here is discovered from the publishers' own GitHub releases.
# No URL is hard coded: assets are matched by pattern, so renames upstream
# surface as "no matching asset" instead of a 404.

# id          family      title       repo                                kind    ver_re                              asset_re                                              arches           channel        homepage
soda|bottles|Soda|bottlesdevs/wine|wine|^soda-([0-9]+(\.[0-9]+)*(-[0-9]+)?)$|^soda-{ver}-{arch}\.tar\.xz$|x86_64,aarch64|stable|https://usebottles.com|Bottles' own Wine fork: Wayland-native, GStreamer, real win32 prefixes.
soda-dev|bottles|Soda (experimental)|bottlesdevs/wine|wine|^soda-([0-9]+(\.[0-9]+)*(-[0-9]+)?)-experimental$|^soda-{ver}-{arch}\.tar\.xz$|x86_64,aarch64|experimental|https://usebottles.com|Soda experimental builds. Expect breakage.
